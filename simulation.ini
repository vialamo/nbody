[domain]
mesh_size_1d = 96
num_particles_1d = 96
box_size_mpc = 96

[cosmology]
omega_baryon = 0.048
omega_M = 0.3
omega_lambda = 0.7
Hubble_h = 0.7
spectral_index = 0.96
sigma_8 = 0.81
expanding_universe = true

[gravity]
comoving_softening_factor = 0.033
softening_cap_scale_factor =  0.3

[initial_conditions]
initial_gas_temp_k = 50
standing_particles = false
seed = 42

[hydro]
use_hydro = true
gamma = 1.6666666667
enable_cooling = true
primordial_mu = 1.22
temp_floor_k = 10.0
cooling_cutoff_k = 10000

[subgrid]
enable_subgrid_gravity = false
enable_subgrid_clumping = true
subgrid_clumping_amplitude = -1

[p3m]
use_pm = true
use_pp = true
cutoff_radius_factor = 3.5
pm_smoothing_cells = 1.0

[time]
max_dt_dynamical_factor = 1e-3
gravity_accuracy_eta = 0.2
hydro_courant_factor = 0.3
a_start = 0.02
a_end = 1.0

[output]
save_hdf5_every_delta_a = 0.005
debug_info_every_seconds = 30
enable_energy_diagnostics = true

[HPC]
num_threads = 20
use_gpu = true
