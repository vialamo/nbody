[domain]
mesh_size_1d = 32
num_dm_particles_1d = 0
num_gas_particles_1d = 32
box_size_mpc = 64

[cosmology]
omega_baryon = 1.0
omega_m = 1.0
omega_lambda = 0.0
hubble_h = 1.0
expanding_universe = true

[gravity]
comoving_softening_factor = 1.0
softening_cap_scale_factor = 0.5
use_pm = true
use_pp = true
cutoff_radius_factor = 4.5
pm_smoothing_cells = 1.25

[initial_conditions]
setup = zeldovich_pancake
use_glass = true
initial_gas_temp_k = 100
seed = 42
glass_folder_path = ../data

[mfm]
target_neighbors = 32
neighbor_tolerance = 0.05
max_iterations = 50
min_hsml_fraction = 0.25
max_condition_number = 5.0
use_exact_riemann = true
gradient_limiter_beta_max = 2.0
gradient_limiter_beta_min = 1.0
pairwise_limiter_psi1 = 0.5
pairwise_limiter_psi2 = 0.25

[thermodynamics]
gamma = 1.6666666667
temp_floor_k = 0.001
dual_energy_threshold = 0.0001
entropy_switch_alpha_kin = 0.001
entropy_switch_alpha_grav = 0.001

[cooling]
enable_cooling = false

[time]
max_dt_dynamical_factor = 1e-3
gravity_accuracy_eta = 0.01
hydro_courant_factor = 0.2
a_start = 0.00990099
a_end = 1.0
individual_particle_time = false

[output]
outputs_folder_path = outputs
save_hdf5_every_delta_a = 0.005
debug_info_every_seconds = 30

[HPC]
num_threads = 20
