[domain]
mesh_size_1d = 40
num_dm_particles_1d = 0
num_gas_particles_1d = 40
box_size_mpc = 40

[cosmology]
omega_baryon = 1.0
omega_M = 1.0
omega_lambda = 0.0
expanding_universe = false

[gravity]
comoving_softening_factor = 0.1
softening_cap_scale_factor = 0.3
use_pm = true
use_pp = true
cutoff_radius_factor = 3.5
pm_smoothing_cells = 1.0

[initial_conditions]
setup = evrard_collapse
use_glass = true
initial_gas_temp_k = 50
seed = 42
glass_folder_path = ../data

[hydro]
hydro_method = mfm
gamma = 1.6666666667
enable_cooling = false
temp_floor_k = 1.0

[mfm]
mfm_target_neighbors = 32
mfm_neighbor_tolerance = 0.05
mfm_max_iterations = 50
mfm_min_hsml_fraction = 0.25
dual_energy_threshold = 0.01
use_exact_riemann = true
gradient_limiter_beta_max = 2.0
gradient_limiter_beta_min = 1.0
pairwise_limiter_psi1 = 0.5
pairwise_limiter_psi2 = 0.25

[subgrid]
enable_subgrid_clumping = false

[time]
max_dt_dynamical_factor = 1e-3
gravity_accuracy_eta = 0.2
hydro_courant_factor = 0.3
a_start = 0.0
a_end = 2.0
individual_particle_time = false

[output]
outputs_folder_path = outputs
save_hdf5_every_delta_a = 0.005
debug_info_every_seconds = 30

[HPC]
num_threads = 20
