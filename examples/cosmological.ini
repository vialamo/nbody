[domain]
mesh_size_1d = 32
num_dm_particles_1d = 32
num_gas_particles_1d = 32
box_size_mpc = 32

[cosmology]
omega_baryon = 0.048
omega_m = 0.3
omega_lambda = 0.7
hubble_h = 0.7
spectral_index = 0.96
sigma_8 = 0.81
expanding_universe = true

[gravity]
comoving_softening_factor = 0.033
softening_cap_scale_factor = 0.3
use_pm = true
use_pp = true
cutoff_radius_factor = 3.5
pm_smoothing_cells = 1.0

[initial_conditions]
setup = cosmological
use_glass = true
fixed_ics = false
invert_phases = false
initial_gas_temp_k = 50
seed_metallicity_solar = 0.0
seed = 42
glass_folder_path = ../data

[hydro]
target_neighbors = 32
neighbor_tolerance = 0.05
max_iterations = 50
min_hsml_fraction = 0.25
max_condition_number = 5.0
use_exact_riemann = false
gradient_limiter_beta_max = 2.0
gradient_limiter_beta_min = 1.0
pairwise_limiter_psi1 = 0.5
pairwise_limiter_psi2 = 0.25

[thermodynamics]
gamma = 1.6666666667
primordial_mu = 1.22
temp_floor_k = 2.73
dual_energy_threshold = 0.001
entropy_switch_alpha_kin = 0.001
entropy_switch_alpha_grav = 0.001

[cooling]
enable_cooling = true
cooling_cutoff_k = 10000
cooling_table_path = ../data/CloudyData_UVB_HM2012.h5

[time]
max_dt_dynamical_factor = 1e-3
gravity_accuracy_eta = 0.01
hydro_courant_factor = 0.3
a_start = 0.02
a_end = 1.0
individual_particle_time = true

[output]
outputs_folder_path = outputs
save_hdf5_every_delta_a = 0.005
debug_info_every_seconds = 30

[HPC]
num_threads = 20
